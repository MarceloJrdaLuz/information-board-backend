name: Daily Push Notifications

on:
  schedule:
    - cron: '0 5 * * *' # Todos os dias às 07:00 BRT 
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily notifications route
        run: |
          curl -s -L -X POST ${{ secrets.API_URL }}/cron/daily-notifications \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_GITHUB }}" \
            -H "Cache-Control: no-cache"
